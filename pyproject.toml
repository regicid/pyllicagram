[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyllicagram"
version = "2.0.0"
description = "Wrapper for the Gallicagram API. Port to Python of the R package rallicagram by Vincent Bagilet."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Benoit de Courson", email = "b.decourson@csl.mpg.de" },
    { name = "Vincent Bagilet", email = "vincent.bagilet@columbia.edu" },
]
keywords = ["gallicagram", "gallica", "ngram", "nlp", "corpus", "french"]
dependencies = [
    "numpy",
    "pandas>=2.0",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
graph = ["plotnine>=0.13"]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "plotnine>=0.13",
]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/regicid/pyllicagram"
"Original R package" = "https://github.com/vincentbagilet/rallicagram"
Gallicagram = "https://www.gallicagram.com/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyllicagram = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Gallicagram API"]
addopts = "-m 'not live'"
